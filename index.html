<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TURBO CONNECT - Pagamento Pix</title>
<style>
:root {
  --cor-primaria: #059669;
  --cor-primaria-hover: #047857;
  --cor-secundaria: #0f172a;
  --cor-card: #ffffff;
  --cor-borda: #e2e8f0;
  --cor-texto: #1e293b;
  --cor-texto-suave: #64748b;
  --sombra: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
  --raio: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(135deg, #dcfce7 0%, #f0fdf4 100%);
  color: var(--cor-texto);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  line-height: 1.5;
}
.container { width: 100%; max-width: 480px; }
.card {
  background: var(--cor-card);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  overflow: hidden;
  border: 1px solid var(--cor-borda);
  animation: surgir 0.4s ease-out;
}
@keyframes surgir {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.cabecalho {
  background: linear-gradient(135deg, var(--cor-primaria) 0%, #10b981 100%);
  padding: 28px 24px;
  text-align: center;
  color: white;
}
.logo {
  width: 80px;
  height: 80px;
  background: white;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.cabecalho h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
.cabecalho p { opacity: 0.9; font-size: 0.95rem; }
.conteudo { padding: 24px; }
.campo { margin-bottom: 16px; }
.campo label {
  display: block;
  font-size: 0.875rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--cor-secundaria);
}
.campo input {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--cor-borda);
  border-radius: 12px;
  font-size: 1rem;
  transition: all 0.2s;
  background: #f8fafc;
}
.campo input:focus {
  outline: none;
  border-color: var(--cor-primaria);
  background: white;
  box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
}
.valor-destaque {
  text-align: center;
  padding: 20px;
  background: #f0fdf4;
  border-radius: 12px;
  margin: 20px 0;
  border: 2px dashed var(--cor-primaria);
}
.valor-destaque.rotulo {
  font-size: 0.875rem;
  color: var(--cor-texto-suave);
  margin-bottom: 4px;
}
.valor-destaque.numero {
  font-size: 2rem;
  font-weight: 800;
  color: var(--cor-primaria);
}
.qr-area { text-align: center; margin: 24px 0; }
.qr-container {
  background: white;
  padding: 20px;
  border-radius: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 2px solid var(--cor-borda);
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  margin: 0 auto 12px;
  width: fit-content;
}
#qr-canvas img { display: block; }
.aviso { font-size: 0.8rem; color: var(--cor-texto-suave); margin-top: 8px; }
.botao {
  width: 100%;
  padding: 14px;
  background: var(--cor-primaria);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
}
.botao:hover {
  background: var(--cor-primaria-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
}
.botao-whatsapp {
  background: #25D366;
  margin-top: 12px;
}
.botao-whatsapp:hover {
  background: #128C7E;
  box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
}
.codigo-pix { margin-top: 16px; }
.codigo-pix textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--cor-borda);
  border-radius: 12px;
  font-size: 0.75rem;
  font-family: monospace;
  resize: none;
  background: #f8fafc;
  height: 90px;
  word-break: break-all;
}
.mensagem {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--cor-primaria);
  color: white;
  padding: 12px 24px;
  border-radius: 50px;
  font-weight: 600;
  box-shadow: var(--sombra);
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 1000;
}
.mensagem.visivel {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.rodape {
  text-align: center;
  padding: 20px 24px;
  font-size: 0.8rem;
  color: var(--cor-texto-suave);
  border-top: 1px solid var(--cor-borda);
  background: #f8fafc;
}
@media (max-width: 480px) {
.cabecalho { padding: 24px 20px; }
.conteudo { padding: 20px; }
.valor-destaque.numero { font-size: 1.75rem; }
body { padding: 12px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="cabecalho">
      <div class="logo">
        <img src="logo.png" alt="Logotipo TurboConnect" onerror="this.parentElement.innerHTML='<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'#059669\' width=\'40\' height=\'40\'><path d=\'M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z\'/></svg>'">
      </div>
      <h1>TURBO CONNECT</h1>
      <p>PAGAMENTO VIA PIX - Rápido e seguro</p>
    </div>

    <div class="conteudo">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo">
      </div>

      <div class="campo">
        <label for="valor">Valor</label>
        <input type="text" id="valor" placeholder="0,00">
      </div>

      <div class="campo">
        <label for="desc">Descrição</label>
        <input type="text" id="desc" placeholder="Mensalidade Internet">
      </div>

      <div class="valor-destaque">
        <div class="rotulo">Valor a pagar</div>
        <div class="numero" id="valor-tela">R$ 0,00</div>
      </div>

      <div class="qr-area">
        <div class="qr-container">
          <div id="qr-canvas"></div>
        </div>
        <p class="aviso">Aponte a câmera do seu banco para o QR Code</p>
      </div>

      <button class="botao" id="btn-copiar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copiar Código PIX
      </button>

      <a class="botao botao-whatsapp" id="btn-whatsapp" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0.16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Enviar Comprovante no WhatsApp
      </a>

      <div class="codigo-pix">
        <label for="codigo">Código PIX Copia e Cola</label>
        <textarea id="codigo" readonly></textarea>
      </div>
    </div>

    <div class="rodape">
      <p><strong>TURBOCONNECT</strong> • TABATINGA-AM</p>
      <p>turboconnect01@gmail.com • 97 98402-8177</p>
    </div>
  </div>
</div>

<div class="mensagem" id="mensagem">Código PIX copiado!</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const PIX_CONFIG = {
  chave: 'turboconnect01@gmail.com',
  nome: 'TURBO CONNECT',
  cidade: 'TABATINGA',
  whatsapp: '5597984028177'
};

const elNome = document.getElementById('nome');
const elValor = document.getElementById('valor');
const elDesc = document.getElementById('desc');
const elValorTela = document.getElementById('valor-tela');
const elCodigo = document.getElementById('codigo');
const elMsg = document.getElementById('mensagem');
const qrContainer = document.getElementById('qr-canvas');
const btnWhatsapp = document.getElementById('btn-whatsapp');

function formatarMoeda(valor) {
  const num = parseFloat(valor.replace(',', '.')) || 0;
  return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function mostrarMensagem(texto) {
  elMsg.textContent = texto;
  elMsg.classList.add('visivel');
  setTimeout(() => elMsg.classList.remove('visivel'), 2500);
}

function limparString(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9 ]/g, '').toUpperCase().substring(0, 25);
}

function gerarCrc16(payload) {
  let polinomio = 0x1021;
  let resultado = 0xFFFF;
  for (let i = 0; i < payload.length; i++) {
    resultado ^= (payload.charCodeAt(i) << 8);
    for (let j = 0; j < 8; j++) {
      if ((resultado & 0x8000)!== 0) {
        resultado = (resultado << 1) ^ polinomio;
      } else {
        resultado = resultado << 1;
      }
    }
  }
  resultado &= 0xFFFF;
  return resultado.toString(16).toUpperCase().padStart(4, '0');
}

function montarCampo(id, valor) {
  const tamanho = valor.length.toString().padStart(2, '0');
  return id + tamanho + valor;
}

function gerarCodigoPix() {
  const valorNum = parseFloat(elValor.value.replace(',', '.')) || 0;
  const valorFormatado = valorNum.toFixed(2);

  const nome = limparString(elNome.value || PIX_CONFIG.nome);
  const cidade = limparString(PIX_CONFIG.cidade);
  const chave = PIX_CONFIG.chave;
  const descricao = limparString(elDesc.value || '');

  let payload = '';
  payload += montarCampo('00', '01');
  payload += montarCampo('01', '11');

  let gui = montarCampo('00', 'BR.GOV.BCB.PIX');
  gui += montarCampo('01', chave);
  if (descricao) gui += montarCampo('02', descricao);
  payload += montarCampo('26', gui);

  payload += montarCampo('52', '0000');
  payload += montarCampo('53', '986');
  if (valorNum > 0) payload += montarCampo('54', valorFormatado);
  payload += montarCampo('58', 'BR');
  payload += montarCampo('59', nome);
  payload += montarCampo('60', cidade);

  const txid = Date.now().toString().substring(0, 25);
  payload += montarCampo('62', montarCampo('05', txid));

  payload += '6304';
  const crc = gerarCrc16(payload);
  const codigoFinal = payload + crc;

  elCodigo.value = codigoFinal;
  elValorTela.textContent = formatarMoeda(elValor.value);

  // Atualiza link do WhatsApp com dados do pagamento
  const nomeCliente = elNome.value || 'Cliente';
  const valorMsg = formatarMoeda(elValor.value);
  const msg = Olá! Acabei de fazer um pagamento Pix.%0A%0A*Nome:* ${nomeCliente}%0A*Valor:* ${valorMsg}%0A%0ASegue o comprovante:;
  btnWhatsapp.href = https://wa.me/${PIX_CONFIG.whatsapp}?text=${msg};

  return codigoFinal;
}

function desenharQRCode(texto) {
  qrContainer.innerHTML = "";
  new QRCode(qrContainer, {
    text: texto,
    width: 320,
    height: 320,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
}

elValor.addEventListener('input', (e) => {
  let v = e.target.value.replace(/[^\d,]/g, '');
  const partes = v.split(',');
  if (partes.length > 2) v = partes[0] + ',' + partes.slice(1).join('');
  if (partes[1] && partes[1].length > 2) v = partes[0] + ',' + partes[1].substring(0, 2);
  e.target.value = v;
});

function atualizarTudo() {
  try {
    const codigo = gerarCodigoPix();
    desenharQRCode(codigo);
  } catch (erro) {
    mostrarMensagem('Não foi possível gerar o pagamento');
  }
}

document.getElementById('btn-copiar').addEventListener('click', () => {
  elCodigo.select();
  elCodigo.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    mostrarMensagem('Código PIX copiado com sucesso!');
  } catch (e) {
    navigator.clipboard.writeText(elCodigo.value).then(() => {
      mostrarMensagem('Código PIX copiado com sucesso!');
    }).catch(() => {
      mostrarMensagem('Não foi possível copiar');
    });
  }
});

elNome.addEventListener('input', atualizarTudo);
elValor.addEventListener('input', atualizarTudo);
elDesc.addEventListener('input', atualizarTudo);

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  elValor.value = params.get('valor') || '200,00';
  elNome.value = params.get('nome') || '';
  elDesc.value = params.get('desc') || 'Mensalidade Internet';
  atualizarTudo();
});
</script>
</body>
</html>
